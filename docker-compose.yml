version: "3.9"
services:
  mongo:
    image: mongo:6
    container_name: tfh-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:16
    container_name: tfh-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tfh
      POSTGRES_PASSWORD: tfhpass
      POSTGRES_DB: tfhdb
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  mongo_data:
  pg_data: