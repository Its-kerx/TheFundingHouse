<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheFundingHouse | My Profile</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    body { background: #0f0e24; color: #e5e7eb; font-family: 'Inter', sans-serif; margin: 0; padding: 24px; }
    .container { max-width: 960px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .title { font-size: 28px; font-weight: 700; }
    .actions { display: flex; gap: 10px; }
    button { border: 1px solid rgba(255,255,255,0.1); background: #1b1f3a; color: #e5e7eb; padding: 10px 14px; border-radius: 10px; cursor: pointer; }
    button:hover { background: #242a4e; }
    .card { background: #111227; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    .card h3 { margin: 0 0 10px 0; font-size: 18px; }
    .row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 14px; }
    .banner { padding: 12px 14px; border-radius: 10px; background: rgba(248,113,113,0.12); color: #fca5a5; margin-bottom: 12px; display: none; }
    .muted { color: #9ca3af; }
    .disabled { opacity: 0.4; pointer-events: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">My Profile</div>
      <div class="actions">
        <button id="btn-back">Back</button>
        <button id="btn-logout">Logout</button>
      </div>
    </div>

    <div id="banner" class="banner"></div>

    <div class="card">
      <h3>Wallet</h3>
      <div class="row"><span>Address</span><span id="wallet-address" class="muted">--</span></div>
      <div class="row"><span>Chain ID</span><span id="wallet-chain" class="muted">--</span></div>
    </div>

    <div class="card">
      <h3>Session</h3>
      <div class="row"><span>Status</span><span id="session-status" class="muted">Checking...</span></div>
    </div>

    <div class="card" id="portfolio-card">
      <h3>Portfolio Overview</h3>
      <div class="row"><span>Total Value</span><span id="portfolio-total" class="muted">--</span></div>
      <div class="row"><span>Native</span><span id="portfolio-native" class="muted">--</span></div>
      <div class="row"><span>Tokens</span><span id="portfolio-count" class="muted">--</span></div>
    </div>
  </div>

  <script src="/js/profile.js"></script>
</body>
</html>
