<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheFundingHouse | Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { bgDark: '#0f0e24', cardDark: '#1a1b3b', brandTeal: '#2dd4bf' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
    
    <style>
        /* Estilos para los botones de tiempo */
        .time-btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            background-color: #1e1e30;
            color: #94a3b8;
        }
        .time-btn:hover { color: white; background-color: #2d2d45; }
        .time-btn.active {
            background-color: #2dd4bf; /* Brand Teal */
            color: #0f0e24; /* Dark text */
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-bgDark text-white font-sans h-screen flex overflow-hidden">

    <aside id="sidebar-container" class="w-64 bg-[#0a0918] border-r border-white/5 hidden md:flex flex-col z-40 h-full flex-shrink-0"></aside>

    <main class="flex-1 flex flex-col h-full relative min-w-0">
        <header class="bg-bgDark/95 backdrop-blur z-30 px-6 py-4 border-b border-white/5 flex flex-col gap-4 flex-shrink-0">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-white">Funding Explorer</h1>
                <a href="../index.html" class="md:hidden text-slate-400 hover:text-white"><i data-lucide="home"></i></a>
            </div>
            
            <div class="flex flex-col xl:flex-row gap-4 justify-between items-end xl:items-center">
                
                <!-- DROPDOWN DE PLATAFORMAS -->
                <div class="flex gap-2 relative">
                    <div class="relative">
                        <button id="platforms-btn" class="bg-brandTeal hover:bg-teal-400 text-bgDark px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition-colors">
                            Platforms <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </button>
                        <!-- Menú Desplegable Oculto -->
                        <div id="platforms-dropdown" class="hidden absolute top-full mt-2 left-0 bg-white text-slate-900 rounded-xl p-4 shadow-xl w-56 z-50 border border-slate-200">
                            <p class="text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">Show Platforms</p>
                            <div class="space-y-2">
                                <label class="flex items-center gap-2 cursor-pointer hover:bg-slate-100 p-1 rounded">
                                    <input type="checkbox" checked class="accent-teal-500 w-4 h-4"> <span>Hyperliquid</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer hover:bg-slate-100 p-1 rounded">
                                    <input type="checkbox" checked class="accent-teal-500 w-4 h-4"> <span>Backpack</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer hover:bg-slate-100 p-1 rounded">
                                    <input type="checkbox" checked class="accent-teal-500 w-4 h-4"> <span>Paradex</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer hover:bg-slate-100 p-1 rounded">
                                    <input type="checkbox" checked class="accent-teal-500 w-4 h-4"> <span>Aster</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <button class="bg-[#1e1e30] text-slate-300 hover:text-white px-4 py-2 rounded-lg font-medium text-sm border border-white/10 transition-colors">
                        Filters
                    </button>
                </div>
                
                <!-- NUEVAS TEMPORALIDADES Y BUSCADOR -->
                <div class="flex flex-col md:flex-row gap-3 w-full xl:w-auto items-center">
                    <div id="time-filters" class="flex flex-wrap gap-2 bg-[#1e1e30]/50 p-1 rounded-lg">
                        <button class="time-btn" data-val="live">Live</button>
                        <button class="time-btn" data-val="1h">1h</button>
                        <button class="time-btn" data-val="8h">8h</button>
                        <button class="time-btn active" data-val="24h">24h</button>
                        <button class="time-btn" data-val="3d">3d</button>
                        <button class="time-btn" data-val="7d">7d</button>
                        <button class="time-btn" data-val="15d">15d</button>
                        <button class="time-btn" data-val="31d">31d</button>
                    </div>
                    
                    <div class="relative w-full md:w-64">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                        <input type="text" placeholder="Search token..." class="w-full bg-[#1e1e30] border border-white/10 rounded-lg py-2 pl-9 pr-4 text-sm text-white focus:outline-none focus:border-brandTeal/50">
                    </div>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-auto p-0 md:p-6 custom-scrollbar">
            <table class="w-full border-separate border-spacing-y-2 text-left">
                <thead class="sticky top-0 bg-bgDark z-10">
                    <tr class="text-slate-500 text-xs uppercase tracking-wider">
                        <th class="px-4 py-3 font-medium bg-bgDark">#</th>
                        <th class="px-4 py-3 font-medium bg-bgDark">Token</th>
                        <th class="px-4 py-3 font-medium bg-bgDark">APR</th>
                        <th class="px-4 py-3 font-medium bg-bgDark">Long / Short</th>
                        <th class="px-4 py-3 font-medium bg-bgDark hidden md:table-cell">Spread</th>
                        <th class="px-4 py-3 font-medium bg-bgDark hidden md:table-cell">Open Interest</th>
                        <th class="px-4 py-3 font-medium bg-bgDark hidden md:table-cell">24h Vol</th>
                        <th class="px-4 py-3 font-medium bg-bgDark text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="funding-table-body">
                    <tr><td colspan="8" class="text-center py-20 text-slate-500">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            lucide.createIcons();
            
            // Inicializar lógica de Dropdown y Filtros
            initUIInteractions(); 
            
            // Cargar datos
            initDashboard(); 
        });
    </script>
</body>
</html>
